
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MenuKita - Menu Digital</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <h1>MenuKita</h1>
    <p>Temukan menu favoritmu</p>
  </header>

  <main class="container">
    <input
      type="search"
      id="search"
      placeholder="Cari makanan atau minuman..."
      aria-label="Cari menu"
    >

    <div class="categories">
      <button data-category="Semua">Semua</button>
      <button data-category="Minuman">Minuman</button>
      <button data-category="Makanan">Makanan</button>
      <button data-category="Camilan">Camilan</button>
    </div>

    <section id="menu-list" class="menu-grid"></section>
    <p id="empty-message" hidden>Menu tidak ditemukan.</p>
  </main>

  <script src="js/menu.js"></script>
</body>
</html>
